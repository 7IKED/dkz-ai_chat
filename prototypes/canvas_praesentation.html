<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Cosmo Präsentation</title>
    <style>
        body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        canvas { border: 1px solid #39FF14; background: #050505; cursor: pointer; max-width: 100vw; max-height: 100vh; }
        .info { position: absolute; bottom: 10px; color: #39FF14; font-family: monospace; animation: pulse 2s infinite; pointer-events: none;}
        @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
    </style>
</head>
<body>
    <canvas id="presCanvas" width="960" height="540"></canvas>
    <div class="info">[KLICKEN ODER PFEILTASTE RECHTS]</div>
    <script>
        const ctx = document.getElementById('presCanvas').getContext('2d');
        const W = 960, H = 540, neon = '#39FF14';
        let slide = 0, frame = 0, history = [];

        function drawText(t, x, y, s, c=neon, a='left') { ctx.font=`${s}px monospace`; ctx.fillStyle=c; ctx.textAlign=a; ctx.fillText(t,x,y); ctx.textAlign='left';}

        function render() {
            ctx.fillStyle = '#050505'; ctx.fillRect(0, 0, W, H);
            
            if(slide === 0) {
                drawText("COSMO_V2 // PRÄSENTATION", W/2, H/2 - 20, 36, neon, 'center');
                ctx.strokeStyle = '#1a4d1a'; ctx.strokeRect(W/2 - 200, H/2 + 50, 400, 10);
                ctx.fillStyle = neon; ctx.fillRect(W/2 - 200, H/2 + 50, 400 * ((Math.sin(frame*0.05)+1)/2), 10);
            } else if (slide === 1) {
                drawText("SERVER-LAST-VERTEILUNG", 40, 60, 24);
                [40,65,80,45,95].forEach((v,i) => {
                    let h = (v/100)*280 + Math.sin(frame*0.1+i)*15;
                    ctx.fillStyle = h > 230 ? '#f33' : '#1a4d1a'; ctx.fillRect(120+i*75, 450-h, 45, h);
                    ctx.strokeStyle = neon; ctx.strokeRect(120+i*75, 450-h, 45, h);
                });
            } else if (slide === 2) {
                drawText("NETZWERK-SIGNAL", 40, 60, 24);
                history.push(Math.sin(frame*0.08)*80 + Math.cos(frame*0.03)*40 + (Math.random()-0.5)*20);
                if(history.length > 800) history.shift();
                ctx.strokeStyle = neon; ctx.beginPath();
                history.forEach((v,i) => i===0 ? ctx.moveTo(80+i, H/2-v) : ctx.lineTo(80+i, H/2-v)); ctx.stroke();
            }

            frame++; requestAnimationFrame(render);
        }

        window.addEventListener('click', () => { slide = (slide + 1) % 3; history=[]; });
        window.addEventListener('keydown', (e) => { if(e.key === 'ArrowRight') { slide = (slide + 1) % 3; history=[]; } });
        render();
    </script>
</body>
</html>
