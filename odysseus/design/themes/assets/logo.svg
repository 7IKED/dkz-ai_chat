      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="240" height="48" fill="none"/>
  <!-- Terminal-Rahmen -->
  <rect x="1" y="7" width="34" height="34" fill="none" stroke="#008F11" stroke-width="1.5"/>
  <path d="M1 7h8M1 7v8M35 7h-8M35 7v8M1 41h8M1 41v-8M35 41h-8M35 41v-8"
