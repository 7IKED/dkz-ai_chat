# ODYSSEUS // LibreChat-Konfiguration (nanoChat-Backend)
# Geschlossenes System: lokale Modelle zuerst (Ollama auf dem Host).
# API-Keys fuer externe Provider kommen NIE hierher — sie liegen im
# VAULT (KeePass) und werden zur Laufzeit injiziert (scripts/vault.sh).
version: 1.2.1
cache: true

endpoints:
  custom:
    - name: "Ollama (lokal)"
      apiKey: "ollama"
      baseURL: "http://host.docker.internal:11434/v1"
      models:
        default: ["llama3.2", "qwen2.5-coder"]
        fetch: true
      titleConvo: true
      titleModel: "current_model"
